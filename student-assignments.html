<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citizen School - Student Assignments (Demo)</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
    <style>
      :root{
        --primary:#4a6bff; --secondary:#00c9a7; --accent:#ff6b81;
        --bg-color:#f8f9fa; --bg-darker:#eaeef4; --card-bg:#ffffff;
        --text-color:#2d3436; --text-muted:#636e72;
        --sidebar-bg:#2d3436; --sidebar-text:#ffffff; --sidebar-hover:rgba(255,255,255,.10);
        --shimmer-color:rgba(0,0,0,.06); --shimmer-bg:rgba(0,0,0,.06);
        --modal-bg:#ffffff;
        --danger:#d63031; --warn:#f39c12; --good:#1faa59;
        --shadow-lg:0 12px 40px rgba(0,0,0,.12), 0 2px 10px rgba(0,0,0,.06);
        --shadow-md:0 8px 24px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);
        --grad:linear-gradient(135deg,var(--primary),var(--secondary));
      }
      @media (prefers-color-scheme: dark){
        :root{
          --primary:#6c5ce7; --secondary:#00cec9; --accent:#fd79a8;
          --bg-color:#0f0f1a; --bg-darker:#0a0a12; --card-bg:rgba(20,20,35,.85);
          --text-color:#f1f1f1; --text-muted:#b0b0c0;
          --sidebar-bg:rgba(15,15,26,.95); --sidebar-text:#ffffff; --sidebar-hover:rgba(108,92,231,.15);
          --shimmer-color:rgba(255,255,255,.12); --shimmer-bg:rgba(255,255,255,.10);
          --modal-bg:#171a24;
          --shadow-lg:0 24px 60px rgba(0,0,0,.45), 0 6px 20px rgba(0,0,0,.35);
          --shadow-md:0 14px 36px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.28);
        }
      }

      *{box-sizing:border-box;transition:background-color .25s,color .25s,border-color .25s}
      body{margin:0;background:radial-gradient(1200px 800px at -10% -20%, rgba(74,107,255,.08), transparent), radial-gradient(1000px 600px at 120% 10%, rgba(0,201,167,.08), transparent), var(--bg-color);color:var(--text-color);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
      a{color:inherit;text-decoration:none}

      .topbar{position:sticky;top:0;z-index:100;backdrop-filter:saturate(1.2) blur(8px);background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.1));border-bottom:1px solid rgba(0,0,0,.08)}
      @media (prefers-color-scheme: dark){.topbar{background:linear-gradient(180deg, rgba(10,10,18,.65), rgba(10,10,18,.25));border-color:rgba(255,255,255,.08)}}
      .topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
      .brand{display:flex;align-items:center;gap:10px}
      .brand-badge{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;box-shadow:var(--shadow-md)}
      .brand-title{font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:.6px;background:linear-gradient(90deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
      .nav-links{display:flex;align-items:center;gap:10px}
      .nav-links a{font-weight:700;border:1px solid rgba(0,0,0,.08);background:var(--card-bg);padding:8px 10px;border-radius:10px}
      .nav-links a:hover{background:var(--bg-darker)}
      .avatar{width:36px;height:36px;border-radius:999px;border:2px solid rgba(0,0,0,.08);object-fit:cover}

      .container{max-width:1200px;margin:18px auto;padding:0 14px;display:grid;gap:14px}

      .hero{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg, rgba(74,107,255,.12), rgba(0,201,167,.12));border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow-md);overflow:hidden;position:relative}
      .hero::after{content:"";position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%)}
      .hero-title{font-family:'Orbitron',sans-serif;color:var(--primary);font-weight:800;letter-spacing:.6px}
      .glow{animation:pulseGlow 2.6s ease-in-out infinite}
      @keyframes pulseGlow{0%,100%{text-shadow:0 0 0 rgba(74,107,255,0)}50%{text-shadow:0 0 18px rgba(74,107,255,.45)}}

      .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
      .left,.right{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
      .search{display:flex;align-items:center;gap:8px;border:1px solid rgba(0,0,0,.08);background:var(--card-bg);border-radius:12px;padding:8px 10px}
      .search input{border:none;background:transparent;color:var(--text-color);outline:none}
      .btn{background:var(--grad);color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:800;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
      .btn:hover{filter:brightness(1.03)}
      .btn:active{transform:translateY(1px)}
      .btn-outline{background:var(--card-bg);color:var(--text-color);border:1px solid rgba(0,0,0,.1);border-radius:12px;padding:10px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
      .segmented{display:flex;background:var(--card-bg);border:1px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden}
      .segmented button{background:transparent;border:none;padding:8px 12px;font-weight:700;color:var(--text-muted)}
      .segmented button.active{background:rgba(74,107,255,.12);color:var(--primary)}

      .grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px}
      @media(max-width:1060px){.grid{grid-template-columns:repeat(2, minmax(0,1fr))}}
      @media(max-width:720px){.grid{grid-template-columns:1fr}}

      .card{background:var(--card-bg);border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:14px;box-shadow:var(--shadow-md);transform:translateY(6px);opacity:0;animation:fadeInUp .5s ease forwards}
      @keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}
      .card:hover{box-shadow:var(--shadow-lg)}
      .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
      .card-title{font-weight:800}
      .muted{color:var(--text-muted)}
      .tag{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:#f2f4f6;color:#636e72}
      .chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.08);font-size:12px;font-weight:700}
      .chip.info{background:#eaf2ff;color:#4a6bff;border-color:#cfe0ff}
      .chip.ok{background:#edfdf0;color:#1faa59;border-color:#c7f3d2}
      .chip.warn{background:#fff8e6;color:#d09100;border-color:#ffe29c}
      .chip.bad{background:#ffe9ef;color:#ff6b81;border-color:#ffc2cd}
      .chip.muted{background:#f2f4f6;color:#636e72;border-color:#e0e6ea}
      .status-dot{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:4px}
      .dot-blue{background:#4a6bff}.dot-green{background:#00c9a7}.dot-amber{background:#ffbb33}.dot-red{background:#ff6b81}.dot-gray{background:#95a5a6}
      .desc{color:var(--text-muted);margin:6px 0 10px 0;line-height:1.5}
      .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .spacer{flex:1}

      .attach-pill{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;background:#eaf2ff;color:#4a6bff;border:1px solid #cfe0ff;font-size:12px}
      .due-pill{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;background:rgba(255,187,51,.12);color:#d09100;border:1px solid #ffe29c;font-size:12px}

      /* Modal */
      .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;display:none;transition:opacity .25s;backdrop-filter:blur(2px);z-index:9999}
      .modal-backdrop.show{display:block;opacity:1}
      .modal{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) scale(.96);background:var(--modal-bg);border:1px solid rgba(0,0,0,.12);border-radius:16px;width:min(900px,92vw);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;z-index:10000;box-shadow:var(--shadow-lg)}
      .modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
      .modal-header{padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center}
      .modal-title{font-weight:800;color:var(--primary)}
      .modal-body{padding:16px}
      .modal-footer{padding:12px 16px;border-top:1px solid rgba(0,0,0,.08);display:flex;justify-content:flex-end;gap:10px}
      .modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      @media(max-width:820px){.modal .grid{grid-template-columns:1fr}}

      .desc-box{border:1px dashed rgba(0,0,0,.15);background:var(--bg-darker);border-radius:12px;padding:10px}
      .dropzone{border:2px dashed rgba(0,0,0,.15);border-radius:12px;background:linear-gradient(180deg,rgba(74,107,255,.06),transparent);padding:14px;text-align:center}
      .dropzone.drag{border-color:var(--primary);background:linear-gradient(180deg,rgba(74,107,255,.12),transparent)}
      .dz-files{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
      .progress{height:8px;background:var(--bg-darker);border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
      .progress > span{display:block;height:100%;background:var(--grad);width:0%}

      /* Shimmer skeleton for initial load */
      .skeleton{background:linear-gradient(90deg, transparent, var(--shimmer-bg), transparent);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

      /* Toast */
      .toast{position:fixed;right:16px;bottom:16px;background:var(--sidebar-bg);color:var(--sidebar-text);padding:10px 12px;border-radius:10px;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:800}
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-badge"><i class="ri-graduation-cap-fill"></i></div>
          <div class="brand-title">STUDENT ASSIGNMENTS</div>
        </div>
        <div class="nav-links">
          <a href="index.html"><i class="ri-home-5-line"></i>&nbsp;Home</a>
          <img class="avatar" alt="avatar" src="pic.jpg" />
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <div>
          <div class="hero-title glow">Your assignments at a glance</div>
          <div class="muted">Submit on time. Track status. Stay ahead.</div>
        </div>
        <div class="row">
          <div class="segmented" role="tablist" aria-label="Filter assignments">
            <button class="active" data-filter="all" aria-selected="true">All</button>
            <button data-filter="active">Active</button>
            <button data-filter="due_soon">Due soon</button>
            <button data-filter="past_due">Past due</button>
            <button data-filter="submitted">Submitted</button>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <div class="left">
          <div class="search"><i class="ri-search-line"></i><input id="search" placeholder="Search title or subject" /></div>
        </div>
        <div class="right">
          <button class="btn-outline" id="refresh"><i class="ri-refresh-line"></i>Refresh</button>
        </div>
      </section>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>

    <!-- Modal: Assignment details and submission -->
    <div class="modal-backdrop" id="backdrop"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Assignment</div>
        <button class="btn-outline" id="closeModal"><i class="ri-close-line"></i>Close</button>
      </div>
      <div class="modal-body">
        <div class="grid">
          <div>
            <div class="desc-box" id="meta"></div>
            <div style="margin-top:10px" id="desc"></div>
          </div>
          <div>
            <div class="dropzone" id="dropzone">
              <div><i class="ri-upload-cloud-2-line"></i> Drag & drop files here, or click to browse</div>
              <input id="fileInput" type="file" multiple style="display:none" />
              <div class="dz-files" id="dzFiles"></div>
            </div>
            <div style="margin-top:10px">
              <label class="muted" for="notes">Notes (optional)</label>
              <textarea id="notes" rows="3" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);background:var(--bg-darker);color:var(--text-color);"></textarea>
            </div>
            <div style="margin-top:10px">
              <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" id="cancel"><i class="ri-arrow-go-back-line"></i>Cancel</button>
        <button class="btn" id="submitBtn"><i class="ri-send-plane-2-line"></i>Submit</button>
      </div>
    </div>

    <script>
      const $=(s,c=document)=>c.querySelector(s);
      const $$=(s,c=document)=>Array.from(c.querySelectorAll(s));
      if(typeof window.showToast!=="function"){
        window.showToast=(m)=>{const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
      }

      // Demo data (aligned with teacher demo)
      const CLASSES=[{id:1,name:'Grade 8-A'},{id:2,name:'Grade 9-B'}];
      const SUBJECTS=[
        {id:11,name:'Mathematics',class_id:1},
        {id:12,name:'Science',class_id:1},
        {id:21,name:'English',class_id:2},
        {id:22,name:'Physics',class_id:2},
      ];
      function addHours(h){ const d=new Date(); d.setHours(d.getHours()+h); return d.toISOString(); }
      const ASSIGNMENTS=[
        {id:1001,class_id:1,subject_id:11,title:'Homework 1 - Fractions',points:20,start_at:addHours(-48),due_at:addHours(12),desc:'Solve worksheet Q1 to Q10',files:[],closed:false},
        {id:1002,class_id:1,subject_id:12,title:'Lab report - Plants',points:50,start_at:addHours(-5),due_at:addHours(36),desc:'Upload photos and findings',files:[{name:'template.docx',size:10240}],closed:false},
        {id:1003,class_id:2,subject_id:22,title:'Kinematics Problem Set',points:40,start_at:addHours(8),due_at:addHours(56),desc:'Chapter 3 numerical questions',files:[],closed:false},
        {id:1004,class_id:2,subject_id:21,title:'Comprehension Passage',points:30,start_at:addHours(-120),due_at:addHours(-24),desc:'Read and answer questions',files:[],closed:false},
      ];

      // Persist demo submission state locally
      const STORE_KEY='demo_student_submissions_v1';
      const loadSubs=()=>{ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch{ return {}; } };
      const saveSubs=(s)=>{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); };
      let SUBMISSIONS=loadSubs();

      // Initialize random states if empty
      if(Object.keys(SUBMISSIONS).length===0){
        ASSIGNMENTS.forEach(a=>{
          const r=Math.random();
          if(r>0.7){
            const submittedAt=new Date(Date.now()-Math.floor(Math.random()*72)*3600*1000).toISOString();
            SUBMISSIONS[a.id]={status:'submitted',submitted_at:submittedAt,files:[{name:'work.pdf',size:10000}],notes:''};
          }
        });
        saveSubs(SUBMISSIONS);
      }

      function statusOf(a){
        if(a.closed) return {k:'closed', label:'Closed', dot:'dot-gray', chip:'muted'};
        const now=Date.now(), s=Date.parse(a.start_at), d=Date.parse(a.due_at);
        if(now < s) return {k:'scheduled', label:'Scheduled', dot:'dot-blue', chip:'info'};
        if(now >= s && now <= d){
          const soon=(d-now)<=48*3600*1000;
          return soon ? {k:'due_soon', label:'Due soon', dot:'dot-amber', chip:'warn'}
                      : {k:'active',   label:'Active',   dot:'dot-green', chip:'ok'};
        }
        return {k:'past_due', label:'Past due', dot:'dot-red', chip:'bad'};
      }
      function sDate(dt){ try{ return new Date(dt).toLocaleString(); }catch{ return dt; } }
      function shortDate(dt){ try{ const d=new Date(dt); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+" · "+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }catch{ return dt; } }
      function timeLeft(iso){ const ms=Date.parse(iso)-Date.now(); const neg=ms<0; const abs=Math.abs(ms); const h=Math.floor(abs/3600000); const m=Math.floor((abs%3600000)/60000); return (neg?'-':'')+ (h>0? h+"h ":"") + m+"m"; }

      const grid=$('#grid');
      const search=$('#search');
      const refresh=$('#refresh');
      const seg=$$('.segmented button');

      let filter='all';
      seg.forEach(b=>b.addEventListener('click',()=>{ seg.forEach(x=>x.classList.remove('active')); b.classList.add('active'); filter=b.dataset.filter; render(); }));
      search.addEventListener('input',()=>render());
      refresh.addEventListener('click',()=>{ render(); showToast('Refreshed'); });

      function render(){
        grid.innerHTML='';
        const q=(search.value||'').trim().toLowerCase();
        ASSIGNMENTS
          .slice()
          .sort((a,b)=>Date.parse(a.due_at)-Date.parse(b.due_at))
          .filter(a=>{
            const st=statusOf(a).k;
            const sub=SUBMISSIONS[a.id]?.status||'not_submitted';
            if(filter==='active' && st!=='active') return false;
            if(filter==='due_soon' && st!=='due_soon') return false;
            if(filter==='past_due' && st!=='past_due') return false;
            if(filter==='submitted' && sub!=='submitted') return false;
            if(!q) return true;
            const cls=CLASSES.find(c=>c.id===a.class_id)?.name||'';
            const subj=SUBJECTS.find(s=>s.id===a.subject_id)?.name||'';
            return [a.title,cls,subj].some(t=>String(t).toLowerCase().includes(q));
          })
          .forEach(a=>{
            const cls=CLASSES.find(c=>c.id===a.class_id)?.name||'';
            const subj=SUBJECTS.find(s=>s.id===a.subject_id)?.name||'';
            const st=statusOf(a);
            const sub=SUBMISSIONS[a.id];
            const subStatus=sub?.status||'not_submitted';
            const dueStr=shortDate(a.due_at);
            const dueLeft=timeLeft(a.due_at);
            const filesHtml=(a.files||[]).map(f=>`<span class="attach-pill"><i class="ri-attachment-2"></i>${f.name}</span>`).join(' ');
            const actionLabel=subStatus==='submitted' ? 'Resubmit' : 'Submit';
            const submittedTag=subStatus==='submitted' ? `<span class="chip ok"><span class="status-dot dot-green"></span>Submitted</span>` : '';

            const card=document.createElement('div');
            card.className='card';
            card.innerHTML=`
              <div class="card-head">
                <div class="row">
                  <span class="chip ${st.chip}"><span class="status-dot ${st.dot}"></span>${st.label}</span>
                  ${submittedTag}
                </div>
                <span class="due-pill"><i class="ri-time-line"></i> Due ${dueStr} · ${dueLeft}</span>
              </div>
              <div class="card-title">${a.title}</div>
              <div class="desc">${a.desc||''}</div>
              <div class="row" style="margin-bottom:8px">
                <span class="tag">Class: ${cls}</span>
                <span class="tag">Subject: ${subj}</span>
                <span class="tag">Points: ${a.points ?? 'N/A'}</span>
              </div>
              <div class="row">${filesHtml}</div>
              <div class="row" style="margin-top:10px">
                <button class="btn-outline" data-action="open" data-id="${a.id}"><i class="ri-eye-line"></i>Open</button>
                <div class="spacer"></div>
                <button class="btn" data-action="submit" data-id="${a.id}"><i class="ri-send-plane-line"></i>${actionLabel}</button>
              </div>
            `;
            grid.appendChild(card);
          });

        // Bind actions
        $$('button[data-action="open"]',grid).forEach(b=>b.addEventListener('click',()=>openModal(Number(b.dataset.id))));
        $$('button[data-action="submit"]',grid).forEach(b=>b.addEventListener('click',()=>openModal(Number(b.dataset.id), true)));
      }

      // Modal + submission
      const backdrop=$('#backdrop'), modal=$('#modal');
      const modalTitle=$('#modalTitle');
      const meta=$('#meta'), desc=$('#desc');
      const dropzone=$('#dropzone'), dzFiles=$('#dzFiles'), fileInput=$('#fileInput');
      const notes=$('#notes');
      const progressBar=$('#progressBar');
      const submitBtn=$('#submitBtn');
      const closeModal=$('#closeModal'), cancel=$('#cancel');
      let currentId=null; let dzList=[]; let submitting=false;

      function openModal(id, focusSubmit=false){
        currentId=id; dzList=[]; submitting=false; progressBar.style.width='0%';
        const a=ASSIGNMENTS.find(x=>x.id===id); if(!a){ showToast('Assignment not found'); return; }
        const cls=CLASSES.find(c=>c.id===a.class_id)?.name||''; const subj=SUBJECTS.find(s=>s.id===a.subject_id)?.name||'';
        modalTitle.textContent=a.title;
        meta.innerHTML=`
          <div class="row" style="margin-bottom:8px">
            <span class="tag">Class: ${cls}</span>
            <span class="tag">Subject: ${subj}</span>
            <span class="tag">Start: ${sDate(a.start_at)}</span>
            <span class="tag">Due: ${sDate(a.due_at)}</span>
            <span class="tag">Points: ${a.points ?? 'N/A'}</span>
          </div>`;
        desc.textContent=a.desc||'';

        const existing=SUBMISSIONS[id];
        notes.value=existing?.notes||'';
        dzFiles.innerHTML='';
        (existing?.files||[]).forEach(f=>addDzPill(f.name,f.size));

        backdrop.classList.add('show'); modal.classList.add('show');
        if(focusSubmit) submitBtn.focus();
      }
      function close(){ modal.classList.remove('show'); backdrop.classList.remove('show'); currentId=null; }
      closeModal.addEventListener('click', close);
      cancel.addEventListener('click', close);
      backdrop.addEventListener('click', close);

      // Dropzone
      const openPicker=()=> fileInput.click();
      dropzone.addEventListener('click', openPicker);
      dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
      dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag'));
      dropzone.addEventListener('drop', e=>{ e.preventDefault(); dropzone.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
      fileInput.addEventListener('change', ()=> handleFiles(fileInput.files));

      function handleFiles(fileList){
        const files=[...fileList];
        files.forEach(f=> addDzPill(f.name, f.size));
        fileInput.value='';
      }
      function addDzPill(name,size){
        const pill=document.createElement('span');
        pill.className='attach-pill';
        pill.innerHTML=`<i class="ri-file-line"></i> ${name} <a style="margin-left:6px;cursor:pointer" aria-label="Remove file"><i class="ri-close-circle-line"></i></a>`;
        const item={name,size};
        dzList.push(item);
        pill.querySelector('a').addEventListener('click',()=>{ dzList=dzList.filter(x=>x!==item); pill.remove(); });
        dzFiles.appendChild(pill);
      }

      submitBtn.addEventListener('click', ()=>{
        if(submitting||currentId==null) return;
        if(dzList.length===0){ showToast('Please add at least one file'); return; }
        submitting=true; progressBar.style.width='0%';
        let p=0; const t=setInterval(()=>{ p+=Math.random()*22; progressBar.style.width=Math.min(100,p)+'%'; if(p>=100){ clearInterval(t); finishSubmit(); } }, 180);
      });

      function finishSubmit(){
        const prev=SUBMISSIONS[currentId]||{};
        SUBMISSIONS[currentId]={status:'submitted', submitted_at:new Date().toISOString(), files:dzList.slice(), notes:notes.value||''};
        saveSubs(SUBMISSIONS);
        render();
        showToast(prev.status==='submitted' ? 'Resubmitted successfully' : 'Submitted successfully');
        setTimeout(()=>{ modal.classList.remove('show'); backdrop.classList.remove('show'); }, 600);
      }

      // Initial skeleton then render
      function renderSkeleton(){
        grid.innerHTML='';
        for(let i=0;i<6;i++){
          const s=document.createElement('div'); s.className='card skeleton'; s.style.height='160px'; s.style.animationDelay=(i*60)+'ms'; grid.appendChild(s);
        }
      }

      renderSkeleton();
      setTimeout(render, 350);
    </script>
  </body>
  </html>
